name: Enterprise security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run security:licenses
      - run: npm run build
      - run: npm run test:unit
      - run: npm run security:sbom
      - run: npm run security:sbom:check
      - run: npm run pack:check

  browser-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:cross-browser

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dependency graph availability
        id: dependency_graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl --silent --show-error --output /tmp/editra-sbom.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")"
          if [ "${status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Dependency graph is unavailable (HTTP ${status}); running audit and license fallback checks."
          fi
      - uses: actions/dependency-review-action@v5
        if: steps.dependency_graph.outputs.enabled == 'true'
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
      - uses: actions/setup-node@v5
        if: steps.dependency_graph.outputs.enabled != 'true'
        with:
          node-version: "22"
          cache: npm
      - name: Run dependency security fallback
        if: steps.dependency_graph.outputs.enabled != 'true'
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run security:licenses

  codeql:
    permissions:
      security-events: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
